name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'Sheaf.Mobile*/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sheaf.Mobile*/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        shell: bash
        run: |
          dotnet --info
          sdk_version="$(jq -er '.sdk.version' global.json)"
          workload_version="$(jq -er '.sdk.workloadVersion' global.json)"
          test "$(dotnet --version)" = "$sdk_version"
          dotnet workload install android
          dotnet workload --info
          test "$(dotnet workload --version)" = "$workload_version"

      - name: Build Android
        run: dotnet build Sheaf.Mobile.Android/Sheaf.Mobile.Android.csproj --configuration Release

  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK resolution
        shell: bash
        run: |
          dotnet --info
          sdk_version="$(jq -er '.sdk.version' global.json)"
          test "$(dotnet --version)" = "$sdk_version"

      - name: Setup iOS .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Sheaf.Mobile.iOS/global.json

      - name: Install iOS workload
        shell: bash
        run: |
          # Shared project references retain the repository's workload set.
          dotnet workload restore Sheaf.Mobile/Sheaf.Mobile.csproj
          cd Sheaf.Mobile.iOS
          dotnet --info
          sdk_version="$(jq -er '.sdk.version' global.json)"
          workload_version="$(jq -er '.sdk.workloadVersion' global.json)"
          test "$(dotnet --version)" = "$sdk_version"
          dotnet workload install ios
          dotnet workload --info
          test "$(dotnet workload --version)" = "$workload_version"

      - name: Verify iOS pack resolution
        shell: bash
        working-directory: Sheaf.Mobile.iOS
        run: |
          resolution="$(dotnet msbuild Sheaf.Mobile.iOS.csproj -property:Configuration=Release -getProperty:NETCoreSdkVersion,TargetFramework,TargetPlatformVersion,XamarinRelativeSdkRootDirectory,_PackageVersion,RecommendedXcodeVersion)"
          echo "$resolution"
          echo "$resolution" | jq -e --arg sdk_version "$(jq -er '.sdk.version' global.json)" '
            .Properties |
            .NETCoreSdkVersion == $sdk_version and
            .TargetFramework == "net10.0-ios" and
            .TargetPlatformVersion == "27.2" and
            (.XamarinRelativeSdkRootDirectory | contains("Microsoft.iOS.Sdk.net10.0_27.2")) and
            ._PackageVersion == "27.2.10000" and
            .RecommendedXcodeVersion == "27.2"
          '

      - name: Build iOS
        working-directory: Sheaf.Mobile.iOS
        run: dotnet build Sheaf.Mobile.iOS.csproj --configuration Release
