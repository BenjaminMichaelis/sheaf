name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'Sheaf.Mobile*/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sheaf.Mobile*/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Android
        run: dotnet build Sheaf.Mobile.Android/Sheaf.Mobile.Android.csproj --configuration Release

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build iOS
        run: dotnet build Sheaf.Mobile.iOS/Sheaf.Mobile.iOS.csproj --configuration Release
