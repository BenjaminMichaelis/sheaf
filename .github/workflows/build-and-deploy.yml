name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Infra/**'
      - '.github/workflows/deploy-infrastructure.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'Infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: pwsh

env:
  TERRAFORM_VERSION: '1.14.6'

# A newer push to the same pull request makes the older run's results moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend

      - name: Lint frontend
        working-directory: Sheaf.Web
        run: pnpm run lint

      - name: Test frontend
        working-directory: Sheaf.Web
        run: pnpm run test

      - name: Build frontend
        working-directory: Sheaf.Web
        run: pnpm run build

  dotnet-checks:
    name: .NET formatting, API client & migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gen:api runs openapi-typescript from Sheaf.Web/node_modules.
      - uses: ./.github/actions/setup-frontend

      - uses: ./.github/actions/setup-backend

      - name: Enforce formatting
        run: .\.github\scripts\Invoke-DotNetFormatStrict.ps1 -Targets Sheaf.Backend.slnf

      - name: Verify generated API client
        run: |
          pnpm --dir Sheaf.Web run gen:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- Sheaf/openapi/v1.json Sheaf.Web/src/api/schema.d.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- Sheaf/openapi/v1.json Sheaf.Web/src/api/schema.d.ts
          if ($untracked) {
            Write-Error "Generated API artifacts are not tracked: $untracked"
            exit 1
          }

      # Builds the AppHost (and Sheaf.Data) itself; this job has no separate full build.
      - name: Check for Pending Database Changes
        run: |
          dotnet tool run dotnet-ef migrations has-pending-model-changes `
            --configuration Release `
            --project Sheaf.Data/Sheaf.Data.csproj `
            --startup-project Sheaf.AppHost/Sheaf.AppHost.csproj

  dotnet-test:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Build
        run: dotnet build Sheaf.Backend.slnf --no-restore --configuration Release

      # Microsoft Testing Platform can stop the run once 10 tests fail in CI:
      # https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-cli-options
      # To enable retries, add Microsoft.Testing.Extensions.Retry to the test project, then pass
      # --retry-failed-tests plus --retry-failed-tests-max-percentage <value> to skip reruns when too many tests fail:
      # https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-retry#retry-1
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      # No --report-trx-filename: every test project shares trx-data, so a fixed name makes each project overwrite the
      # last one's report. Since MTP 2.3.0 the default name is {asm}_{tfm}_{arch}.trx, one file per test project:
      # https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-test-reports
      - name: Test
        run: dotnet test --solution Sheaf.Backend.slnf --no-build --configuration Release --verbosity normal --maximum-failed-tests 10 --results-directory trx-data --report-trx

      # Skip the SDK's consolidated copy under trx-data/merged so failures are not listed twice.
      - name: Generate merged failure playlist from TRX
        if: always()
        run: |
          $trxFiles = Get-ChildItem -Path "trx-data" -Recurse -File -Filter "*.trx" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -ne 'merged' } |
            Select-Object -ExpandProperty FullName

          if (-not $trxFiles) {
            Write-Host "No TRX files found. Skipping playlist generation."
            exit 0
          }

          New-Item -ItemType Directory -Path "test-results" -Force | Out-Null

          $args = @("tool", "run", "trx-to-vsplaylist", "convert")
          $args += $trxFiles
          $args += @("--outcome", "Failed", "--output", "test-results/failed-tests.playlist", "--skip-empty")
          dotnet @args

      - name: Upload failed test playlist
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-playlist
          path: test-results/failed-tests.playlist
          if-no-files-found: ignore

      - name: Upload test failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-logs
          path: '**/TestResults/logs/*.log'
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: .NET publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Publishing Sheaf.Web runs `pnpm run build` and copies dist/ into wwwroot.
      - uses: ./.github/actions/setup-frontend

      - uses: ./.github/actions/setup-backend

      - name: Publish
        run: dotnet publish Sheaf.Backend.slnf --no-restore --configuration Release

      - name: Build Database Bundle
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          dotnet tool run dotnet-ef migrations bundle `
            --self-contained `
            --no-build `
            --configuration Release `
            --project Sheaf.Data/Sheaf.Data.csproj `
            --startup-project Sheaf.AppHost/Sheaf.AppHost.csproj `
            --output efbundle

      - name: Upload DB Migration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: DatabaseMigration
          path: 'efbundle'
          retention-days: 1

  # The main branch ruleset requires a check named "build". This job keeps that name and passes only when every job
  # split out of the original build job succeeded, so the ruleset does not need to list each job.
  build:
    name: build
    if: always()
    needs: [frontend, dotnet-checks, dotnet-test, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          Write-Error "One or more CI jobs did not succeed: ${{ toJSON(needs) }}"
          exit 1

  # Build the backend image on every run, without pushing, so Dockerfile and base-image changes are checked before they
  # reach a deploy.
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Sheaf/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: sheaf:ci
          cache-from: type=gha,scope=sheaf-image
          cache-to: type=gha,mode=max,scope=sheaf-image

      # Church meeting dates are kept in IANA time zones, which need the tz database at runtime. Chiseled images have
      # no shell, so copy a zone file out of a created (not started) container to prove it is present.
      - name: Verify time zone data in image
        run: |
          $container = docker create sheaf:ci
          try {
            docker cp "${container}:/usr/share/zoneinfo/America/Chicago" ./zone-check
            if ($LASTEXITCODE -ne 0) {
              Write-Error "The runtime image has no tz database (/usr/share/zoneinfo)."
              exit 1
            }
          }
          finally {
            docker rm $container | Out-Null
          }

  automerge:
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    needs: [build, docker-image]
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

